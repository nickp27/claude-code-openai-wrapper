name: Build arm64 image

# Publishes a linux/arm64 image to GHCR for hosts that the upstream
# Docker Hub image (amd64-only) can't serve. Tags come from the
# [tool.poetry] version in pyproject.toml, not from git tags: the
# release process (see check-sdk-version.yml) bumps pyproject +
# src/__init__.py + CHANGELOG and never cuts a v* ref, so semver
# tagging off refs would never match.

on:
  push:
    branches: [main, akki]
  workflow_dispatch:

# contents: read to check out; packages: write so the default
# GITHUB_TOKEN can push to GHCR. Nothing else is needed.
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Read version from pyproject.toml
        id: version
        run: |
          set -euo pipefail
          version=$(python3 -c '
          import re, pathlib
          text = pathlib.Path("pyproject.toml").read_text()
          m = re.search(r"^\[tool\.poetry\].*?^version\s*=\s*\"([^\"]+)\"",
                        text, re.S | re.M)
          if not m:
              raise SystemExit("Could not find [tool.poetry] version in pyproject.toml")
          print(m.group(1))
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Parsed version: $version"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write build summary
        run: |
          set -euo pipefail
          {
            echo "## arm64 image published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Platform | \`linux/arm64\` |"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
